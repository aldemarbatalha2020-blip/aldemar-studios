spring.application.name=aldemar-studios

server.port=${PORT:8080}

# ============================================================
# BANCO DE DADOS - ALDEMAR STUDIOS
# ============================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# VAADIN
# ============================================================

vaadin.launch-browser=false

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ============================================================
# EMAIL - BREVO
# ============================================================

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# SEGURANÃ‡A
# ============================================================

aldemar.security.allowed-origin=${ALDEMAR_ALLOWED_ORIGIN:https://aldemarstudios.com}
aldemar.security.password-reset-expiration-minutes=15
aldemar.security.max-login-attempts=5

# ============================================================
# UPLOADS
# ============================================================

aldemar.upload.max-file-size=10485760

# ============================================================
# IDENTIDADE
# ============================================================

aldemar.studios.name=Aldemar Studios
aldemar.studios.developer=Developed by Aldemar FlorÃªncio

# ============================================================
# LOGGING
# ============================================================

logging.level.org.springframework.security=INFO
