spring.application.name=aldemar-studios

server.port=8080

# ============================================================
# BANCO DE DADOS
# ============================================================

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/aldemar_studios_java?useSSL=true&requireSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# VAADIN
# ============================================================

vaadin.launch-browser=false

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ============================================================
# EMAIL - BREVO
# ============================================================

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# SEGURANÇA
# ============================================================

aldemar.security.allowed-origin=${ALDEMAR_ALLOWED_ORIGIN:http://localhost:8080}
aldemar.security.password-reset-expiration-minutes=15
aldemar.security.max-login-attempts=5

# ============================================================
# UPLOADS
# ============================================================

aldemar.upload.max-file-size=10485760

# ============================================================
# IDENTIDADE
# ============================================================

aldemar.studios.name=Aldemar Studios
aldemar.studios.developer=Developed by Aldemar Florêncio
logging.level.org.springframework.security=DEBUG
