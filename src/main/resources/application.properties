spring.application.name=aldemar-studios

server.port=${PORT:8080}

# BANCO DE DADOS - RAILWAY
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&socketTimeout=10000
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# VAADIN
vaadin.launch-browser=false

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# EMAIL - BREVO
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SEGURANCA
aldemar.security.allowed-origin=${ALDEMAR_ALLOWED_ORIGIN:https://aldemarstudios.com}
aldemar.security.password-reset-expiration-minutes=15
aldemar.security.max-login-attempts=5

# UPLOADS
aldemar.upload.max-file-size=10485760

# IDENTIDADE
aldemar.studios.name=Aldemar Studios
aldemar.studios.developer=Developed by Aldemar Florencio

# LOGGING
logging.level.org.springframework.security=INFO
