<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova senha - Aldemar Studios</title>
<link rel="stylesheet" href="/css/recuperacao.css">
</head>
<body>

<div class="recuperacao-container">
    <div class="recuperacao-card">

        <div class="logo">ALDEMAR <span>STUDIOS</span></div>

        <div class="etapas">
            <div class="etapa ativa"><b>✓</b><span>Enviar código</span></div>
            <div class="linha"></div>
            <div class="etapa ativa"><b>✓</b><span>Verificar</span></div>
            <div class="linha"></div>
            <div class="etapa ativa"><b>3</b><span>Nova senha</span></div>
        </div>

        <div class="icone">🔐</div>

        <h1>Criar nova senha</h1>

        <p class="descricao">
            O código foi confirmado. Agora escolha uma nova senha para sua conta.
        </p>

        <form id="resetForm">

            <label for="novaSenha">Nova senha</label>
            <input
                type="password"
                id="novaSenha"
                placeholder="Digite sua nova senha"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <label for="confirmarSenha" style="margin-top:18px;">
                Confirmar nova senha
            </label>
            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite novamente sua nova senha"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <div class="descricao" style="font-size:12px; margin:10px 0 0;">
                A nova senha deve possuir pelo menos 8 caracteres.
            </div>

            <div id="mensagem"></div>

            <button type="submit" id="btnReset">
                SALVAR NOVA SENHA
            </button>

        </form>

    </div>
</div>

<script src="/js/reset-password.js"></script>
</body>
</html>
