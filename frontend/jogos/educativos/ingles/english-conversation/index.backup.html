<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Conversation | Aldemar Studios</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #07111f;
    color: #ffffff;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.container {
    width: min(900px, 100%);
    text-align: center;
    padding: 50px 30px;
    border-radius: 24px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(0, 200, 255, 0.12);
    border: 1px solid rgba(0, 200, 255, 0.25);
    color: #7ddcff;
    font-size: 13px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(32px, 6vw, 58px);
    margin: 0 0 15px;
}

p {
    color: #b9c7d8;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 35px;
}

button {
    border: 0;
    border-radius: 14px;
    padding: 15px 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #ffffff;
    color: #07111f;
}

button:hover {
    transform: translateY(-2px);
}
</style>
</head>

<body>

<div class="container">

    <div class="badge">ALDEMAR STUDIOS • ENGLISH GAMES</div>

    <h1>English Conversation</h1>

    <p>
        Jogo educativo de inglês desenvolvido para praticar
        vocabulário, compreensão, escrita, leitura, gramática
        e comunicação de forma divertida.
    </p>

    <button onclick="history.back()">← Voltar</button>

</div>

</body>
</html>
