<html lang="pt-BR">

<meta charset="UTF-8">

<title>ENGLISH BATTLE QUIZ</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #172554 0%, #020617 45%, #000 100%);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

/* =========================
   MENU
========================= */

#menu{
    text-align:center;
}

.logo{
    font-size:clamp(42px,8vw,90px);
    font-weight:900;
    letter-spacing:4px;
    color:#38bdf8;
    text-shadow:
        0 0 10px #38bdf8,
        0 0 30px #0ea5e9;
}

.logo span{
    color:white;
}

.subtitle{
    margin-top:10px;
    color:#94a3b8;
    font-size:18px;
    letter-spacing:4px;
}

.menu-box{
    width:min(600px,95vw);
    margin:40px auto 0;
    background:rgba(15,23,42,.92);
    border:1px solid #334155;
    border-radius:25px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.team-inputs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:25px;
}

.team-input{
    background:#020617;
    border:1px solid #334155;
    border-radius:15px;
    padding:18px;
}

.team-input label{
    display:block;
    color:#94a3b8;
    margin-bottom:8px;
    font-size:13px;
    text-transform:uppercase;
}

.team-input input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    font-size:17px;
    outline:none;
}

.team-input input:focus{
    border-color:#38bdf8;
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:25px;
}

.info div{
    background:#0f172a;
    border-radius:12px;
    padding:15px 8px;
}

.info strong{
    display:block;
    color:#38bdf8;
    font-size:22px;
}

.info small{
    color:#94a3b8;
}

.start-btn{
    width:100%;
    padding:18px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    color:white;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.start-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(14,165,233,.35);
}

/* =========================
   GAME
========================= */

#game{
    display:none;
    flex-direction:column;
    justify-content:flex-start;
    padding:20px;
}

.topbar{
    width:min(1100px,100%);
    margin:auto;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr 100px 1fr;
    gap:12px;
    align-items:center;
}

.team-score{
    background:#0f172a;
    border:2px solid #334155;
    border-radius:18px;
    padding:15px;
    text-align:center;
    transition:.3s;
}

.team-score.active{
    border-color:#38bdf8;
    box-shadow:0 0 25px rgba(56,189,248,.25);
    transform:scale(1.02);
}

.team-score .name{
    color:#cbd5e1;
    font-weight:bold;
    font-size:16px;
}

.team-score .points{
    font-size:38px;
    font-weight:900;
    color:#38bdf8;
}

.vs{
    text-align:center;
    font-weight:900;
    color:#64748b;
    font-size:20px;
}

.progress-area{
    margin-top:15px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    color:#94a3b8;
    font-size:14px;
    margin-bottom:7px;
}

.progress{
    height:8px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#38bdf8,#2563eb);
    transition:.3s;
}

/* =========================
   QUESTION
========================= */

.question-card{
    width:min(1000px,100%);
    margin:35px auto 0;
    background:rgba(15,23,42,.97);
    border:1px solid #334155;
    border-radius:25px;
    padding:30px;
    box-shadow:0 20px 70px rgba(0,0,0,.4);
}

.turn{
    text-align:center;
    color:#38bdf8;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:14px;
}

.category{
    text-align:center;
    color:#64748b;
    margin-top:8px;
    font-size:13px;
}

.question{
    text-align:center;
    font-size:clamp(25px,4vw,42px);
    font-weight:900;
    margin:35px 10px;
    line-height:1.2;
}

.translation{
    text-align:center;
    color:#94a3b8;
    font-size:16px;
    margin-top:-20px;
    margin-bottom:25px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer{
    min-height:75px;
    border:2px solid #334155;
    border-radius:15px;
    background:#020617;
    color:white;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.answer:hover:not(:disabled){
    border-color:#38bdf8;
    background:#0f172a;
    transform:translateY(-2px);
}

.answer.correct{
    background:#14532d;
    border-color:#22c55e;
}

.answer.wrong{
    background:#7f1d1d;
    border-color:#ef4444;
}

.answer:disabled{
    cursor:default;
}

.timer-box{
    margin:25px auto 0;
    width:min(400px,90%);
}

.timer-text{
    text-align:center;
    font-weight:900;
    color:#facc15;
    font-size:18px;
    margin-bottom:7px;
}

.timer{
    height:8px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
}

.timer-bar{
    height:100%;
    width:100%;
    background:#22c55e;
    transition:width 1s linear;
}

/* =========================
   FEEDBACK
========================= */

.feedback{
    min-height:45px;
    text-align:center;
    margin-top:20px;
    font-weight:bold;
    font-size:19px;
}

.next-btn{
    display:none;
    margin:10px auto 0;
    padding:14px 30px;
    border:0;
    border-radius:12px;
    background:#38bdf8;
    color:#020617;
    font-weight:900;
    cursor:pointer;
}

/* =========================
   RESULT
========================= */

#result{
    display:none;
    text-align:center;
}

.result-box{
    width:min(700px,95vw);
    background:#0f172a;
    border:1px solid #334155;
    border-radius:25px;
    padding:40px 25px;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.trophy{
    font-size:70px;
}

.winner{
    font-size:42px;
    font-weight:900;
    color:#38bdf8;
    margin:15px 0;
}

.final-scores{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin:30px 0;
}

.final-team{
    background:#020617;
    border-radius:15px;
    padding:20px;
}

.final-team h3{
    color:#cbd5e1;
}

.final-points{
    font-size:45px;
    font-weight:900;
    color:#38bdf8;
    margin-top:5px;
}

.restart{
    width:100%;
    padding:17px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:13px;
    font-weight:900;
    font-size:18px;
    cursor:pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

    .team-inputs{
        grid-template-columns:1fr;
    }

    .info{
        grid-template-columns:1fr;
    }

    .scoreboard{
        grid-template-columns:1fr 50px 1fr;
    }

    .team-score .points{
        font-size:28px;
    }

    .answers{
        grid-template-columns:1fr;
    }

    .question-card{
        padding:20px;
        margin-top:20px;
    }

    .question{
        margin:25px 5px;
    }
}

</style>
</head>

/* ============================================================
   VARIÁVEIS DO JOGO
============================================================ */

let questions = [];
let currentQuestion = 0;

let scores = [0,0];

let currentTeam = 0;

let teamNames = ["GRUPO 1","GRUPO 2"];

let timer;
let timeLeft = 15;

let answered = false;


/* ============================================================
   EMBARALHAR
============================================================ */

function shuffle(array){

    let arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];

    }

    return arr;
}


/* ============================================================
   INICIAR
============================================================ */

function startGame(){

    teamNames[0] =
        document.getElementById("team1Input").value.trim()
        || "GRUPO 1";

    teamNames[1] =
        document.getElementById("team2Input").value.trim()
        || "GRUPO 2";


    /*
       Seleciona exatamente 50 questões aleatórias
       do banco.
    */

    questions = shuffle(questionBank).slice(0,50);


    scores = [0,0];

    currentQuestion = 0;

    currentTeam = 0;


    document.getElementById("name1").textContent = teamNames[0];
    document.getElementById("name2").textContent = teamNames[1];


    document.getElementById("menu").style.display = "none";
    document.getElementById("result").style.display = "none";

    document.getElementById("game").style.display = "flex";


    updateScores();

    showQuestion();

}


/* ============================================================
   MOSTRAR QUESTÃO
============================================================ */

function showQuestion(){

    clearInterval(timer);

    answered = false;

    timeLeft = 15;


    const q = questions[currentQuestion];


    document.getElementById("questionCounter").textContent =
        `Questão ${currentQuestion + 1} de 50`;


    document.getElementById("currentTurn").textContent =
        `Vez do ${teamNames[currentTeam]}`;


    document.getElementById("turnLabel").textContent =
        `VEZ DO ${teamNames[currentTeam]}`;


    document.getElementById("category").textContent =
        q.cat;


    document.getElementById("question").textContent =
        q.q;


    document.getElementById("translation").textContent =
        getInstruction(q.cat);


    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";


    /*
       Também embaralhamos as alternativas.
    */

    const options = q.a.map((text,index)=>({
        text:text,
        correct:index === q.c
    }));

    const shuffledOptions = shuffle(options);


    shuffledOptions.forEach(option=>{

        const btn = document.createElement("button");

        btn.className = "answer";

        btn.textContent = option.text;

        btn.dataset.correct =
            option.correct ? "true" : "false";

        btn.onclick = ()=>checkAnswer(btn);

        answers.appendChild(btn);

    });


    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").style.display = "none";


    updateScores();

    updateProgress();

    startTimer();

}


/* ============================================================
   INSTRUÇÕES
============================================================ */

function getInstruction(category){

    if(category === "VOCABULARY"){
        return "Escolha o significado correto.";
    }

    if(category === "VERBS"){
        return "Escolha a tradução correta do verbo.";
    }

    if(category === "TO BE"){
        return "Complete a frase corretamente.";
    }

    if(category === "ARTICLES"){
        return "Escolha a alternativa correta.";
    }

    if(category === "QUESTIONS"){
        return "Escolha a resposta correta.";
    }

    return "Escolha a alternativa correta.";
}


/* ============================================================
   TIMER
============================================================ */

function startTimer(){

    const bar =
        document.getElementById("timerBar");

    const text =
        document.getElementById("timerText");


    bar.style.width = "100%";

    text.textContent = "15 segundos";


    timer = setInterval(()=>{

        timeLeft--;

        text.textContent =
            `${timeLeft} segundo${timeLeft === 1 ? "" : "s"}`;


        bar.style.width =
            `${(timeLeft / 15) * 100}%`;


        if(timeLeft <= 0){

            clearInterval(timer);

            timeExpired();

        }

    },1000);

}


/* ============================================================
   TEMPO ESGOTADO
============================================================ */

function timeExpired(){

    if(answered) return;

    answered = true;


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(btn=>{

        btn.disabled = true;

        if(btn.dataset.correct === "true"){
            btn.classList.add("correct");
        }

    });


    document.getElementById("feedback").innerHTML =
        "⏰ <span style='color:#facc15'>TEMPO ESGOTADO!</span>";


    document.getElementById("nextBtn").style.display =
        "block";

}


/* ============================================================
   RESPOSTA
============================================================ */

function checkAnswer(button){

    if(answered) return;

    answered = true;

    clearInterval(timer);


    const correct =
        button.dataset.correct === "true";


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(btn=>{

        btn.disabled = true;

        if(btn.dataset.correct === "true"){
            btn.classList.add("correct");
        }

    });


    if(correct){

        button.classList.add("correct");

        scores[currentTeam]++;

        document.getElementById("feedback").innerHTML =
            `🎉 CORRETO! <span style="color:#22c55e">${teamNames[currentTeam]} +1 ponto!</span>`;

    }else{

        button.classList.add("wrong");

        document.getElementById("feedback").innerHTML =
            `❌ ERRADO! A resposta correta está destacada em verde.`;

    }


    updateScores();


    document.getElementById("nextBtn").style.display =
        "block";

}


/* ============================================================
   PRÓXIMA QUESTÃO
============================================================ */

function nextQuestion(){

    currentQuestion++;


    if(currentQuestion >= 50){

        finishGame();

        return;

    }


    /*
       Alterna o grupo a cada questão.
    */

    currentTeam =
        currentTeam === 0 ? 1 : 0;


    showQuestion();

}


/* ============================================================
   PLACAR
============================================================ */

function updateScores(){

    document.getElementById("points1").textContent =
        scores[0];

    document.getElementById("points2").textContent =
        scores[1];


    document.getElementById("score1")
        .classList.toggle("active", currentTeam === 0);

    document.getElementById("score2")
        .classList.toggle("active", currentTeam === 1);

}


/* ============================================================
   PROGRESSO
============================================================ */

function updateProgress(){

    const percent =
        ((currentQuestion + 1) / 50) * 100;

    document.getElementById("progressBar")
        .style.width = percent + "%";

}


/* ============================================================
   FINAL
============================================================ */

function finishGame(){

    clearInterval(timer);


    document.getElementById("game").style.display =
        "none";

    document.getElementById("result").style.display =
        "flex";


    document.getElementById("finalName1").textContent =
        teamNames[0];

    document.getElementById("finalName2").textContent =
        teamNames[1];


    document.getElementById("finalScore1").textContent =
        scores[0];

    document.getElementById("finalScore2").textContent =
        scores[1];


    let winner;


    if(scores[0] > scores[1]){

        winner =
            `🏆 ${teamNames[0]} VENCEU!`;

    }else if(scores[1] > scores[0]){

        winner =
            `🏆 ${teamNames[1]} VENCEU!`;

    }else{

        winner =
            "🤝 EMPATE!";

    }


    document.getElementById("winner").textContent =
        winner;

}
