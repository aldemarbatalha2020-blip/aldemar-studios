<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>English Hangman | Aldemar Studios</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#020617;
    --bg2:#172554;
    --panel:rgba(15,23,42,.96);
    --panel2:rgba(30,41,59,.82);
    --border:rgba(96,165,250,.28);
    --blue:#60a5fa;
    --blue2:#2563eb;
    --blue3:#1d4ed8;
    --text:#f8fafc;
    --muted:#94a3b8;
    --success:#4ade80;
    --danger:#f87171;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #172554 0%,
            #020617 45%,
            #000 100%
        );

    color:var(--text);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow-x:hidden;

    overscroll-behavior:none;

    touch-action:manipulation;
}

button{
    font-family:inherit;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
}

.game-container{

    width:100%;
    max-width:950px;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:24px;

    padding:30px;

    box-shadow:
        0 0 50px rgba(37,99,235,.18),
        inset 0 0 30px rgba(30,64,175,.08);
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:38px;
    color:var(--blue);

    margin-bottom:8px;

    text-shadow:
        0 0 15px rgba(96,165,250,.5);
}

.header p{
    color:var(--muted);
    font-size:15px;
}

/* =========================
   STATS
========================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;
}

.stat{

    background:var(--panel2);

    border:1px solid #334155;

    border-radius:14px;

    padding:15px;

    text-align:center;
}

.stat span{
    display:block;
}

.stat-label{

    font-size:12px;

    color:var(--muted);

    margin-bottom:5px;
}

.stat-value{

    font-size:23px;

    font-weight:bold;

    color:var(--text);

    min-height:27px;
}

/* =========================
   GAME AREA
========================= */

.game-area{

    display:grid;

    grid-template-columns:
        280px 1fr;

    gap:30px;

    align-items:center;
}

/* =========================
   HANGMAN
========================= */

.hangman-area{

    display:flex;

    justify-content:center;
    align-items:center;
}

.hangman{

    width:230px;
    height:280px;

    position:relative;
}

.base{

    position:absolute;

    bottom:10px;
    left:20px;

    width:190px;
    height:8px;

    background:#94a3b8;

    border-radius:10px;
}

.pole{

    position:absolute;

    bottom:18px;
    left:55px;

    width:8px;
    height:230px;

    background:#94a3b8;

    border-radius:10px;
}

.top{

    position:absolute;

    top:25px;
    left:55px;

    width:120px;
    height:8px;

    background:#94a3b8;

    border-radius:10px;
}

.rope{

    position:absolute;

    top:30px;
    right:50px;

    width:6px;
    height:40px;

    background:#94a3b8;
}

.body-part{

    display:none;

    position:absolute;

    border-color:var(--blue);
}

.head{

    top:65px;
    right:25px;

    width:55px;
    height:55px;

    border:6px solid var(--blue);

    border-radius:50%;
}

.body{

    top:120px;
    right:48px;

    width:7px;
    height:75px;

    background:var(--blue);
}

.arm-left{

    top:130px;
    right:50px;

    width:55px;
    height:7px;

    background:var(--blue);

    transform:
        rotate(-35deg);

    transform-origin:right center;
}

.arm-right{

    top:130px;
    right:0;

    width:55px;
    height:7px;

    background:var(--blue);

    transform:
        rotate(35deg);

    transform-origin:left center;
}

.leg-left{

    top:188px;
    right:48px;

    width:55px;
    height:7px;

    background:var(--blue);

    transform:
        rotate(-45deg);

    transform-origin:right center;
}

.leg-right{

    top:188px;
    right:0;

    width:55px;
    height:7px;

    background:var(--blue);

    transform:
        rotate(45deg);

    transform-origin:left center;
}

/* =========================
   CONTENT
========================= */

.content{
    text-align:center;
}

.level{

    display:inline-block;

    background:var(--blue2);

    padding:7px 14px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    margin-bottom:15px;
}

.hint{

    background:var(--panel2);

    border:1px solid #334155;

    border-radius:12px;

    padding:14px;

    margin-bottom:25px;

    line-height:1.5;
}

.hint strong{
    color:var(--blue);
}

.word{

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

    margin:25px 0;

    min-height:55px;
}

.letter{

    width:42px;
    height:50px;

    border-bottom:
        3px solid var(--blue);

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:28px;

    font-weight:bold;

    text-transform:uppercase;
}

/* =========================
   KEYBOARD
========================= */

.keyboard{

    display:grid;

    grid-template-columns:
        repeat(9,1fr);

    gap:7px;

    margin-top:25px;
}

.key{

    min-height:48px;

    border:1px solid #334155;

    border-radius:8px;

    padding:10px 5px;

    background:#1e293b;

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:
        background .18s ease,
        transform .18s ease,
        border-color .18s ease;
}

.key:hover:not(:disabled){

    background:var(--blue2);

    border-color:var(--blue);

    transform:translateY(-2px);
}

.key:active:not(:disabled){

    transform:
        scale(.94);
}

.key:disabled{

    cursor:not-allowed;

    opacity:.35;
}

.key.correct{

    background:#15803d;

    border-color:#4ade80;
}

.key.wrong{

    background:#b91c1c;

    border-color:#f87171;
}

/* =========================
   MESSAGE
========================= */

.message{

    min-height:30px;

    margin-top:20px;

    font-size:18px;

    font-weight:bold;
}

.message.success{
    color:var(--success);
}

.message.error{
    color:var(--danger);
}

.message.info{
    color:var(--blue);
}

/* =========================
   BUTTONS
========================= */

.next-button,
.restart-button{

    display:none;

    margin:20px auto 0;

    border:1px solid
        rgba(96,165,250,.4);

    border-radius:12px;

    padding:13px 28px;

    background:
        linear-gradient(
            135deg,
            var(--blue2),
            var(--blue3)
        );

    color:white;

    font-weight:bold;

    font-size:15px;

    cursor:pointer;

    transition:
        transform .18s ease,
        filter .18s ease,
        box-shadow .18s ease;
}

.next-button:hover,
.restart-button:hover{

    transform:
        translateY(-2px);

    filter:brightness(1.1);

    box-shadow:
        0 10px 25px
        rgba(37,99,235,.25);
}

.next-button:active,
.restart-button:active{

    transform:
        scale(.96);
}

/* =========================
   GAME OVER
========================= */

.game-over{

    display:none;

    text-align:center;

    margin-top:25px;

    padding-top:25px;

    border-top:
        1px solid #334155;
}

.game-over h2{

    color:var(--blue);

    font-size:30px;

    margin-bottom:10px;
}

.game-over p{

    color:#cbd5e1;

    margin-bottom:10px;
}

/* =========================
   TABLET
========================= */

@media (max-width:900px){

    body{
        padding:14px;
        align-items:flex-start;
    }

    .game-container{

        margin:
            auto 0;

        padding:24px;

        border-radius:20px;
    }

    .game-area{

        grid-template-columns:
            220px 1fr;

        gap:20px;
    }

    .hangman{

        transform:
            scale(.82);
    }

    .keyboard{

        grid-template-columns:
            repeat(7,1fr);
    }

}

/* =========================
   MOBILE
========================= */

@media (max-width:750px){

    body{

        padding:10px;

        align-items:flex-start;
    }

    .game-container{

        width:100%;

        padding:
            18px 14px;

        border-radius:18px;
    }

    .header{

        margin-bottom:18px;
    }

    .header h1{

        font-size:
            clamp(
                24px,
                7vw,
                32px
            );

        line-height:1.15;
    }

    .header p{

        font-size:12px;

        line-height:1.5;
    }

    .stats{

        gap:8px;

        margin-bottom:18px;
    }

    .stat{

        padding:10px 7px;

        border-radius:11px;
    }

    .stat-label{
        font-size:9px;
    }

    .stat-value{

        font-size:18px;

        overflow:hidden;
    }

    .game-area{

        grid-template-columns:1fr;

        gap:4px;
    }

    .hangman-area{

        height:205px;

        margin-top:-5px;

        margin-bottom:-8px;
    }

    .hangman{

        transform:
            scale(.68);

        transform-origin:
            center center;
    }

    .hint{

        font-size:13px;

        padding:11px;

        margin-bottom:17px;
    }

    .word{

        gap:7px;

        margin:
            18px 0;

        min-height:45px;
    }

    .letter{

        width:32px;
        height:42px;

        font-size:22px;

        border-bottom-width:2px;
    }

    .keyboard{

        grid-template-columns:
            repeat(7,1fr);

        gap:5px;

        margin-top:18px;
    }

    .key{

        min-height:44px;

        padding:8px 2px;

        font-size:13px;

        border-radius:7px;
    }

    .message{

        font-size:15px;

        margin-top:14px;
    }

}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width:450px){

    body{
        padding:7px;
    }

    .game-container{

        padding:
            15px 10px;

        border-radius:15px;
    }

    .header h1{
        font-size:23px;
    }

    .header p{
        font-size:11px;
    }

    .stats{

        grid-template-columns:
            repeat(3,1fr);

        gap:5px;
    }

    .stat{

        padding:8px 4px;
    }

    .stat-label{
        font-size:8px;
    }

    .stat-value{
        font-size:15px;
    }

    .hangman-area{
        height:180px;
    }

    .hangman{
        transform:
            scale(.58);
    }

    .hint{
        font-size:11px;
    }

    .word{
        gap:5px;
    }

    .letter{

        width:28px;
        height:37px;

        font-size:19px;
    }

    .keyboard{

        grid-template-columns:
            repeat(6,1fr);

        gap:4px;
    }

    .key{

        min-height:42px;

        font-size:12px;

        padding:7px 1px;
    }

    .next-button,
    .restart-button{

        width:100%;

        min-height:48px;

        margin-top:15px;
    }

}

/* =========================
   LANDSCAPE CELULAR
========================= */

@media
    (max-height:550px)
    and (orientation:landscape){

    body{

        padding:6px;

        align-items:flex-start;
    }

    .game-container{

        max-width:1000px;

        padding:12px 16px;
    }

    .header{

        margin-bottom:10px;
    }

    .header h1{

        font-size:22px;

        margin-bottom:3px;
    }

    .header p{
        display:none;
    }

    .stats{

        margin-bottom:10px;
    }

    .game-area{

        grid-template-columns:
            190px 1fr;

        gap:12px;
    }

    .hangman-area{

        height:190px;
    }

    .hangman{

        transform:
            scale(.58);
    }

    .hint{

        margin-bottom:8px;

        padding:7px;

        font-size:11px;
    }

    .word{

        margin:10px 0;

        min-height:38px;
    }

    .letter{

        width:27px;

        height:35px;

        font-size:18px;
    }

    .keyboard{

        margin-top:8px;

        gap:4px;
    }

    .key{

        min-height:36px;

        padding:5px;

        font-size:11px;
    }

    .message{

        min-height:20px;

        margin-top:6px;

        font-size:13px;
    }

}

/* =========================
   REDUZIR MOVIMENTO
========================= */

@media (prefers-reduced-motion:reduce){

    *{
        scroll-behavior:auto!important;
        transition:none!important;
        animation:none!important;
    }

}

</style>

</head>

<body>

<div class="game-container">

    <div class="header">

        <h1>🇬🇧 ENGLISH HANGMAN</h1>

        <p>
            Guess the English word before you run out of lives!
        </p>

    </div>


    <div class="stats">

        <div class="stat">

            <span class="stat-label">
                LIVES
            </span>

            <span
                class="stat-value"
                id="lives"
            >
                ❤️❤️❤️❤️❤️❤️
            </span>

        </div>


        <div class="stat">

            <span class="stat-label">
                SCORE
            </span>

            <span
                class="stat-value"
                id="score"
            >
                0
            </span>

        </div>


        <div class="stat">

            <span class="stat-label">
                WORD
            </span>

            <span class="stat-value">

                <span id="currentWord">
                    1
                </span>

                /

                <span id="totalWords">
                    10
                </span>

            </span>

        </div>

    </div>


    <div class="game-area">


        <div class="hangman-area">

            <div class="hangman">

                <div class="base"></div>

                <div class="pole"></div>

                <div class="top"></div>

                <div class="rope"></div>


                <div
                    class="body-part head"
                    id="part1"
                ></div>

                <div
                    class="body-part body"
                    id="part2"
                ></div>

                <div
                    class="body-part arm-left"
                    id="part3"
                ></div>

                <div
                    class="body-part arm-right"
                    id="part4"
                ></div>

                <div
                    class="body-part leg-left"
                    id="part5"
                ></div>

                <div
                    class="body-part leg-right"
                    id="part6"
                ></div>

            </div>

        </div>


        <div class="content">


            <div
                class="level"
                id="level"
            >
                BEGINNER
            </div>


            <div class="hint">

                💡

                <strong>
                    Hint:
                </strong>

                <span id="hint">
                    Something you drink in the morning.
                </span>

            </div>


            <div
                class="word"
                id="word"
            ></div>


            <div
                class="message info"
                id="message"
            >
                Choose a letter!
            </div>


            <div
                class="keyboard"
                id="keyboard"
            ></div>


            <button
                class="next-button"
                id="nextButton"
                type="button"
            >
                ➡️ NEXT WORD
            </button>

        </div>

    </div>


    <div
        class="game-over"
        id="gameOver"
    >

        <h2>
            🎉 GAME COMPLETE!
        </h2>

        <p id="finalScore"></p>

        <button
            class="restart-button"
            id="restartButton"
            type="button"
        >
            🔄 PLAY AGAIN
        </button>

    </div>

</div>


<script>

const words = [

    {
        word:"COFFEE",
        hint:"Something you drink in the morning.",
        level:"BEGINNER"
    },

    {
        word:"HOUSE",
        hint:"A place where people live.",
        level:"BEGINNER"
    },

    {
        word:"SCHOOL",
        hint:"A place where students study.",
        level:"BEGINNER"
    },

    {
        word:"FAMILY",
        hint:"Parents, children, brothers and sisters.",
        level:"BEGINNER"
    },

    {
        word:"FRIEND",
        hint:"Someone you like and trust.",
        level:"BEGINNER"
    },

    {
        word:"TEACHER",
        hint:"A person who teaches students.",
        level:"EASY"
    },

    {
        word:"MORNING",
        hint:"The first part of the day.",
        level:"EASY"
    },

    {
        word:"HAPPINESS",
        hint:"The feeling of being happy.",
        level:"EASY"
    },

    {
        word:"ADVENTURE",
        hint:"An exciting or unusual experience.",
        level:"INTERMEDIATE"
    },

    {
        word:"KNOWLEDGE",
        hint:"Information and understanding gained through learning.",
        level:"INTERMEDIATE"
    }

];


let currentIndex = 0;

let selectedWord = "";

let guessedLetters = [];

let wrongAttempts = 0;

let score = 0;

const maxAttempts = 6;


const wordElement =
    document.getElementById("word");

const keyboardElement =
    document.getElementById("keyboard");

const livesElement =
    document.getElementById("lives");

const scoreElement =
    document.getElementById("score");

const currentWordElement =
    document.getElementById("currentWord");

const totalWordsElement =
    document.getElementById("totalWords");

const hintElement =
    document.getElementById("hint");

const levelElement =
    document.getElementById("level");

const messageElement =
    document.getElementById("message");

const nextButton =
    document.getElementById("nextButton");

const gameOverElement =
    document.getElementById("gameOver");

const restartButton =
    document.getElementById("restartButton");

const finalScoreElement =
    document.getElementById("finalScore");


totalWordsElement.textContent =
    words.length;


/* =========================
   INICIAR PALAVRA
========================= */

function startWord(){

    selectedWord =
        words[currentIndex].word;

    guessedLetters = [];

    wrongAttempts = 0;

    hintElement.textContent =
        words[currentIndex].hint;

    levelElement.textContent =
        words[currentIndex].level;

    currentWordElement.textContent =
        currentIndex + 1;

    messageElement.textContent =
        "Choose a letter!";

    messageElement.className =
        "message info";

    nextButton.style.display =
        "none";

    resetHangman();

    createWord();

    createKeyboard();

    updateLives();

}


/* =========================
   PALAVRA
========================= */

function createWord(){

    wordElement.innerHTML = "";

    selectedWord
        .split("")
        .forEach(letter => {

            const letterElement =
                document.createElement("div");

            letterElement.classList.add(
                "letter"
            );

            if(
                guessedLetters.includes(letter)
            ){

                letterElement.textContent =
                    letter;

            }

            wordElement.appendChild(
                letterElement
            );

        });

}


/* =========================
   TECLADO
========================= */

function createKeyboard(){

    keyboardElement.innerHTML = "";

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    alphabet
        .split("")
        .forEach(letter => {

            const button =
                document.createElement("button");

            button.type =
                "button";

            button.textContent =
                letter;

            button.classList.add(
                "key"
            );

            button.setAttribute(
                "aria-label",
                "Escolher letra " + letter
            );

            button.addEventListener(
                "click",
                () =>
                    guessLetter(
                        letter,
                        button
                    )
            );

            keyboardElement.appendChild(
                button
            );

        });

}


/* =========================
   ESCOLHER LETRA
========================= */

function guessLetter(
    letter,
    button
){

    if(
        button.disabled ||
        !selectedWord
    ){
        return;
    }

    button.disabled = true;


    if(
        selectedWord.includes(letter)
    ){

        guessedLetters.push(
            letter
        );

        button.classList.add(
            "correct"
        );

        messageElement.textContent =
            "✅ Correct!";

        messageElement.className =
            "message success";

        score += 10;

        scoreElement.textContent =
            score;

        createWord();

        checkWin();

    }else{

        wrongAttempts++;

        button.classList.add(
            "wrong"
        );

        messageElement.textContent =
            "❌ Wrong letter!";

        messageElement.className =
            "message error";

        score =
            Math.max(
                0,
                score - 2
            );

        scoreElement.textContent =
            score;

        updateHangman();

        updateLives();


        if(
            wrongAttempts >= maxAttempts
        ){

            loseWord();

        }

    }

}


/* =========================
   VERIFICAR VITÓRIA
========================= */

function checkWin(){

    const completed =
        selectedWord
            .split("")
            .every(
                letter =>
                    guessedLetters.includes(letter)
            );

    if(!completed){
        return;
    }

    score += 25;

    scoreElement.textContent =
        score;

    messageElement.textContent =
        "🎉 Excellent! Word completed!";

    messageElement.className =
        "message success";

    disableKeyboard();

    if(
        currentIndex <
        words.length - 1
    ){

        nextButton.style.display =
            "block";

    }else{

        finishGame();

    }

}


/* =========================
   PERDEU A PALAVRA
========================= */

function loseWord(){

    messageElement.textContent =
        `❌ The word was: ${selectedWord}`;

    messageElement.className =
        "message error";

    revealWord();

    disableKeyboard();

    if(
        currentIndex <
        words.length - 1
    ){

        nextButton.style.display =
            "block";

    }else{

        finishGame();

    }

}


/* =========================
   REVELAR PALAVRA
========================= */

function revealWord(){

    guessedLetters =
        [...new Set(
            selectedWord.split("")
        )];

    createWord();

}


/* =========================
   DESABILITAR TECLADO
========================= */

function disableKeyboard(){

    const keys =
        keyboardElement.querySelectorAll(
            ".key"
        );

    keys.forEach(
        key =>
            key.disabled = true
    );

}


/* =========================
   FORCA
========================= */

function updateHangman(){

    const part =
        document.getElementById(
            `part${wrongAttempts}`
        );

    if(part){

        part.style.display =
            "block";

    }

}


/* =========================
   RESET FORCA
========================= */

function resetHangman(){

    for(
        let i = 1;
        i <= maxAttempts;
        i++
    ){

        const part =
            document.getElementById(
                `part${i}`
            );

        if(part){

            part.style.display =
                "none";

        }

    }

}


/* =========================
   VIDAS
========================= */

function updateLives(){

    const remaining =
        Math.max(
            0,
            maxAttempts - wrongAttempts
        );

    livesElement.textContent =
        "❤️".repeat(remaining);

}


/* =========================
   FINAL
========================= */

function finishGame(){

    setTimeout(() => {

        gameOverElement.style.display =
            "block";

        finalScoreElement.textContent =
            `You finished the game with ${score} points!`;

        nextButton.style.display =
            "none";

    },500);

}


/* =========================
   PRÓXIMA PALAVRA
========================= */

nextButton.addEventListener(
    "click",
    () => {

        if(
            currentIndex >=
            words.length - 1
        ){
            return;
        }

        currentIndex++;

        startWord();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =========================
   REINICIAR
========================= */

restartButton.addEventListener(
    "click",
    () => {

        currentIndex = 0;

        score = 0;

        scoreElement.textContent =
            score;

        gameOverElement.style.display =
            "none";

        startWord();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =========================
   TECLADO FÍSICO
========================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toUpperCase();

        if(
            key.length !== 1 ||
            !/^[A-Z]$/.test(key)
        ){
            return;
        }

        const buttons =
            keyboardElement.querySelectorAll(
                ".key"
            );

        buttons.forEach(button => {

            if(
                button.textContent === key &&
                !button.disabled
            ){

                button.click();

            }

        });

    }
);


/* =========================
   INÍCIO
========================= */

startWord();

</script>

</body>
</html>
